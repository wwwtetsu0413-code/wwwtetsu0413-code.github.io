
<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Tetsuhiro Tokitaが開発するミニカーGARAGEの公式ページです。">
  <title>Tetsuhiro Tokita | Developer</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      color: #263238;
      background: #f7f9fc;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI",
        "Noto Sans JP", "Hiragino Kaku Gothic ProN", Meiryo, sans-serif;
      line-height: 1.8;
    }
    header {
      padding: 24px 20px;
      background: #fff;
      border-bottom: 1px solid #e5e9ef;
    }
    .header-inner, main, footer {
      width: 100%;
      max-width: 880px;
      margin: 0 auto;
    }
    .site-name { margin: 0; font-size: 18px; font-weight: 700; }
    main { padding: 64px 20px 72px; }
    .hero { margin-bottom: 48px; }
    .eyebrow {
      margin: 0 0 12px;
      color: #526b8a;
      font-size: 13px;
      font-weight: 700;
      letter-spacing: .12em;
    }
    h1 { margin: 0 0 20px; font-size: clamp(28px, 5vw, 40px); line-height: 1.4; }
    .intro, section p { color: #52606d; }
    .intro { margin: 0; font-size: 16px; }
    section {
      margin-top: 36px;
      padding: 28px;
      background: #fff;
      border: 1px solid #e5e9ef;
      border-radius: 12px;
    }
    h2 { margin: 0 0 12px; font-size: 20px; }
    section p { margin: 0; }
    .links { display: flex; flex-wrap: wrap; gap: 12px; margin-top: 20px; }
    .link {
      display: inline-block;
      padding: 10px 16px;
      color: #2459a9;
      background: #f1f6ff;
      border: 1px solid #d8e5fb;
      border-radius: 8px;
      text-decoration: none;
      font-weight: 600;
      overflow-wrap: anywhere;
    }
    .link:hover { background: #e6efff; }
    footer {
      padding: 24px 20px 32px;
      color: #75808b;
      border-top: 1px solid #e5e9ef;
      font-size: 13px;
      text-align: center;
    }
    @media (max-width: 600px) {
      main { padding-top: 40px; }
      section { padding: 22px; }
    }
  </style>
</head>
<body>
  <header>
    <div class="header-inner">
      <p class="site-name">Tetsuhiro Tokita</p>
    </div>
  </header>

  <main>
    <div class="hero">
      <p class="eyebrow">DEVELOPER WEBSITE</p>
      <h1>アプリ開発について</h1>
      <p class="intro">
        Tetsuhiro Tokitaが開発・運営するアプリの情報を掲載しています。
      </p>
    </div>

    <section>
      <h2>ミニカーGARAGE</h2>
      <p>
        トミカ・ミニカーのコレクションを管理するアプリです。
        お気に入りのミニカーを記録し、自分だけのコレクションを楽しめます。
      </p>
    </section>

    <section>
      <h2>関連リンク</h2>
      <p>
        アプリに関する情報およびプライバシーに関する方針は、
        以下のページをご確認ください。
      </p>
      <div class="links">
        <a class="link"
           href="https://wwwtetsu0413-code.github.io/tomica-privacy-policy/"
           target="_blank" rel="noopener noreferrer">
          プライバシーポリシー
        </a>
        <a class="link"
           href="https://wwwtetsu0413-code.github.io/app-ads.txt"
           target="_blank" rel="noopener noreferrer">
          app-ads.txt
        </a>
      </div>
    </section>
  </main>

  <footer>
    <p>&copy; 2026 Tetsuhiro Tokita</p>
  </footer>
</body>
</html>
